# Headless RetroArch for the emulation bench: no window, no sound card, no
# pad (the bench proxy core presses the buttons). @DIR@ is the run folder.
video_driver = "null"
audio_driver = "null"
input_driver = "null"
joypad_driver = "null"
menu_driver = "null"
config_save_on_exit = "false"
video_vsync = "false"
fastforward_ratio = "0.0"
savefile_directory = "@DIR@/saves"
savestate_directory = "@DIR@/states"
system_directory = "@DIR@/system"
core_options_path = "@DIR@/options.cfg"
global_core_options = "true"
game_specific_options = "false"
auto_overrides_enable = "false"
auto_remaps_enable = "false"
savestate_auto_load = "false"
savestate_auto_save = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
cheevos_enable = "false"
