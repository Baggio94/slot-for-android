name: cart-refs

on:
  push:
    branches: [tools/cart-colours]
    paths: [tools/cart-colours/refs.txt, tools/cart-colours/refs.py, .github/workflows/cart-refs.yml]

jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: cart-colours-NES-MD-none
          restore-keys: cart-colours-NES-MD-
      # The x1 renders only: the x4 upscale is too big for the log.
      - run: python3 -u tools/cart-colours/refs.py
