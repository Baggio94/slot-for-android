name: slot. for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main, 'beta/**', 'release/**']
    tags: ['v*', 'konkr-v*']

permissions:
  contents: read

jobs:
  # PokeDaisy 1.6.2.1's source, kept by slot. in the draft release
  # pokedaisy-source-717f4f4 (lidor30/pokedaisy left GitHub): only a token
  # that can write sees a draft, so this small job alone fetches it.
  pokedaisy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch PokeDaisy's source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/795292846" > pokedaisy-source.tar.gz
          shasum -a 256 pokedaisy-source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: pokedaisy-source
          path: pokedaisy-source.tar.gz
          retention-days: 1

  arm64-apk:
    needs: [pokedaisy-source]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          # Google SDK's CDN occasionally returns a corrupt/truncated NDK ZIP.
          # A fresh hosted runner cannot reuse a partial download, so retry
          # the pinned NDK instead of failing a healthy source checkout.
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              echo "Verified Android NDK r27c installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android NDK 27.2 download failed after four attempts"
              exit 1
            fi
            echo "::warning::Transient SDK/NDK download error, retry $attempt of 4"
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-toolchain.toml (channel = "1.96") exactly.
          # "1.96.0" and "1.96" can install into DISTINCT rustup homes;
          # cargo reads the project's 1.96 override.
          toolchain: '1.96'
          targets: aarch64-linux-android
      # Faster builds (3.0.1-beta13): Rust's compiled crates, cargo-ndk and
      # Gradle's caches come back from the last run of the same lock file.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64-apk
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Read app version
        run: |
          set -euo pipefail
          gradle=android/app/build.gradle.kts
          code="$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' "$gradle")"
          name="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' "$gradle")"
          test -n "$code" && test -n "$name"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "slot. $name ($code)"
      - name: Export cartridge material checks
        run: cargo run --locked -p slot-ui --example material_preview -- "$RUNNER_TEMP/material-preview" 1.3333333
      - uses: actions/upload-artifact@v6
        with:
          name: slot-for-android-${{ env.VERSION_NAME }}-material-previews
          path: ${{ runner.temp }}/material-preview
          if-no-files-found: error
      - name: Export Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              # Drawn at 3x: Slot's 24px band.
              assert width > 45 and height == 72, (name, width, height)
              print(f'Verified Slot legend {name}: {width}x{height}')
          PY
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # The libretro cores only change with their build scripts, patches and
      # pinned revisions (all in these files): built again only then.
      - name: Cores built before
        id: cores
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/*_libretro.so
            android/app/src/main/assets/core-build-*.json
            android/app/src/main/assets/licenses
          key: cores-v1-${{ hashFiles('scripts/build-mgba-android.sh', 'scripts/build-gpsp-android.sh', 'scripts/build-gambatte-android.sh', 'scripts/build-home-core-android.sh', 'scripts/build-pokedaisy-android.sh', 'scripts/build-pico8-core-android.sh', 'scripts/patch-*.py', 'cores/**') }}
      - name: Validate core patch scripts
        if: steps.cores.outputs.cache-hit != 'true'
        run: python3 -m py_compile scripts/patch-mgba-speculative-audio.py scripts/patch-gpsp-speculative-audio.py scripts/patch-mgba-active-sram.py scripts/patch-mgba-sun.py scripts/patch-mgba-twb64.py scripts/patch-mgba-gb-direct-cable.py scripts/patch-mgba-link-peer-bios.py scripts/patch-gpsp-backend-diagnostic.py
      - name: Build mGBA arm64 libretro core
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Test the Game Boy Link cable (host build of the same mGBA source)
        if: steps.cores.outputs.cache-hit != 'true'
        run: bash tools/gb-link-test/test.sh
      - name: Build gpSP arm64 libretro core
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Build Gambatte arm64 libretro core
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gambatte-android.sh
      - name: Build NES, SNES, Mega Drive, Master System, Game Gear, Neo Geo Pocket, WonderSwan, Lynx, Pokemon mini, PICO-8, Neo Geo and PC Engine arm64 libretro cores
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for core in fceumm nestopia snes9x bsnes genesis_plus_gx picodrive gearsystem mednafen_ngp race mednafen_wswan handy mednafen_lynx pokemini fake08 fbneo geolith mednafen_pce_fast mednafen_pce; do
            bash scripts/build-home-core-android.sh "$core"
          done
      - name: Build the PICO-8 arm64 libretro core (loads the player's own PICO-8)
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-pico8-core-android.sh
      - uses: actions/download-artifact@v7
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          name: pokedaisy-source
          path: ${{ runner.temp }}/pokedaisy
      - name: Build PokeDaisy arm64 libretro core
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          # PokeDaisy 1.6.2.1's source (the pokedaisy-source job); the
          # script checks its SHA-256.
          export POKEDAISY_SOURCE="$RUNNER_TEMP/pokedaisy/pokedaisy-source.tar.gz"
          bash scripts/build-pokedaisy-android.sh
      - name: Assemble signed ARM64 release
        env:
          SLOT_KEYSTORE_BASE64: ${{ secrets.SLOT_KEYSTORE_BASE64 }}
          SLOT_SIGNING_STORE_PASSWORD: ${{ secrets.SLOT_SIGNING_STORE_PASSWORD }}
          SLOT_SIGNING_KEY_ALIAS: ${{ secrets.SLOT_SIGNING_KEY_ALIAS }}
          SLOT_SIGNING_KEY_PASSWORD: ${{ secrets.SLOT_SIGNING_KEY_PASSWORD }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
          # Internet Multiplayer relay (tools/slot-relay), host[:port].
          # Set it under Settings > Secrets and variables > Actions > Variables.
          SLOT_RELAY_ADDR: ${{ vars.SLOT_RELAY_ADDR }}
        run: |
          set -euo pipefail
          test -n "$SLOT_RELAY_ADDR" || echo "::warning::SLOT_RELAY_ADDR not set: this APK cannot play Internet Multiplayer"
          test -n "$SCREENSCRAPER_DEV_ID" || echo "::warning::ScreenScraper credentials missing: no NES/SNES/MD labels"
          test -n "$SLOT_KEYSTORE_BASE64" || { echo "::error::Configure permanent signing secrets"; exit 1; }
          export SLOT_SIGNING_STORE_FILE="$RUNNER_TEMP/slot-konkr-signing.jks"
          (umask 077; printf '%s' "$SLOT_KEYSTORE_BASE64" | base64 -d > "$SLOT_SIGNING_STORE_FILE")
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
          gradle --no-daemon -p android :app:assembleRelease
      - name: Verify every MainActivity JNI symbol is exported in shipped ARM64 binary
        run: |
          set -euo pipefail
          SO="$RUNNER_TEMP/libslot_android.so"
          unzip -p android/app/build/outputs/apk/release/app-release.apk \
            lib/arm64-v8a/libslot_android.so > "$SO"
          test -s "$SO"
          NDK_NM="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NDK_NM" -D --defined-only "$SO" > "$RUNNER_TEMP/slot-jni-exports.txt"
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("android/app/src/main/java/fyi/slot/konkr/MainActivity.kt").read_text()
          expected = set(re.findall(r"\bexternal\s+fun\s+([A-Za-z0-9_]+)\s*\(", source))
          nm_text = Path(__import__("os").environ["RUNNER_TEMP"], "slot-jni-exports.txt").read_text()
          exported = set(re.findall(r"\bJava_fyi_slot_konkr_MainActivity_([A-Za-z0-9_]+)\b", nm_text))
          assert len(expected) >= 50, f"Unexpected external declaration count: {len(expected)}"
          missing = sorted(expected - exported)
          if missing:
              raise SystemExit("Missing JNI exports in signed APK: " + ", ".join(missing))
          print(f"Verified {len(expected)} MainActivity JNI method exports in signed ARM64 APK")
          PY
      - name: Verify Mac AVD debug APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/mac-lab-badging.txt"
          grep -F "package: name='fyi.slot.konkr.diag' versionCode='$VERSION_CODE'" "$RUNNER_TEMP/mac-lab-badging.txt"
          grep -F "versionName='$VERSION_NAME-mac-lab'" "$RUNNER_TEMP/mac-lab-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
          for core in slot_android mgba_libretro gpsp_libretro gambatte_libretro fceumm_libretro nestopia_libretro snes9x_libretro bsnes_libretro genesis_plus_gx_libretro picodrive_libretro gearsystem_libretro mednafen_ngp_libretro race_libretro mednafen_wswan_libretro handy_libretro mednafen_lynx_libretro pokemini_libretro pokedaisy_libretro fbneo_libretro geolith_libretro mednafen_pce_fast_libretro mednafen_pce_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          if unzip -Z -1 "$APK" | grep -Eq '^lib/(x86_64|x86|armeabi-v7a)/'; then
            echo "::error::Lab APK must remain ARM64 for Apple Silicon AVD"; exit 1
          fi
          # The manifest must be side-by-side safe: own FileProvider authority.
          unzip -Z -1 "$APK" | grep -Fx 'AndroidManifest.xml'
          grep -F 'fyi.slot.konkr.diag' "$RUNNER_TEMP/mac-lab-badging.txt"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: slot-for-android-${{ env.VERSION_NAME }}-mac-avd-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify signed ARM64 APK and upgrade compatibility
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/konkr-badging.txt"
          grep -F "package: name='fyi.slot.konkr' versionCode='$VERSION_CODE'" "$RUNNER_TEMP/konkr-badging.txt"
          grep -F "versionName='$VERSION_NAME'" "$RUNNER_TEMP/konkr-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" |
            grep -Fi '4f42b8f0ac98f6a0102804ab51020ea0e7e2de7685c6ce09400a744de0b0fa2f'
          for core in slot_android mgba_libretro gpsp_libretro gambatte_libretro fceumm_libretro nestopia_libretro snes9x_libretro bsnes_libretro genesis_plus_gx_libretro picodrive_libretro gearsystem_libretro mednafen_ngp_libretro race_libretro mednafen_wswan_libretro handy_libretro mednafen_lynx_libretro pokemini_libretro pokedaisy_libretro fbneo_libretro geolith_libretro mednafen_pce_fast_libretro mednafen_pce_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          if unzip -Z -1 "$APK" | grep -Eq '^lib/(x86_64|x86|armeabi-v7a)/'; then
            echo "::error::Non-ARM64 ABI included in production APK"; exit 1
          fi
          # Prevent a future signed build from silently omitting either
          # mandatory upstream safety patch or selecting a different core.
          python3 - "$APK" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              mgba = json.loads(archive.read("assets/core-build-mgba.json"))
              gpsp = json.loads(archive.read("assets/core-build-gpsp.json"))
              gambatte = json.loads(archive.read("assets/core-build-gambatte.json"))
          assert mgba["revision"] == "7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6"
          assert gpsp["revision"] == "5819380c2ffb0900219d700a382ee68c464ebb99"
          assert gambatte["revision"] == "77f2567d718b8973d02caa2daa8dce4953faf811"
          home = {
              "fceumm": "ac0d00a7fc01166f84c7bac01d1084ebfd2b865e",
              "nestopia": "f1e02d12664834536edbf7352995a3d0cd1caef4",
              "snes9x": "204ea1c0b851f960cbf223075eb1c25641cb483c",
              "bsnes": "63ee22f7af8f5d1ada295c2c98fd7bf261fa62a7",
              "genesis_plus_gx": "b9c2316441978d4015ba30e9a95d9b0e6f8ee981",
              "picodrive": "1890c2932234c9d30f4cd3851d02228baae8f09e",
              "gearsystem": "4b3b1b266e536848ab23b8733f783ae17f0126a6",
              "mednafen_ngp": "a50d5ac288a81f2104ddf43195a4efdd15c72227",
              "race": "c660d9ab5aafb47aefff90182ca90d319ad9b077",
              "mednafen_wswan": "4b01295838ea89e3f1355bbe4cb5cf98aa6108cd",
              "handy": "bc55d462f0b2d6b073ea93dc552ebd73cec60fd1",
              "mednafen_lynx": "fcdefcfb3c11d6d2e71be076a5d3df2e88ab73ed",
              "pokemini": "132111b76343559860532a1ccc094f93f1ed5650",
              "fbneo": "85c89235d5358aa3282d78d837e7682f77dee82f",
              "geolith": "f91bfdee1e821c4078cea68187f72d7ee0f59d1b",
              "mednafen_pce_fast": "4cf066e22533186d0cfad85a0fec2aced93e4e29",
              "mednafen_pce": "974fe085a9842be2069afc95beaf469a90e9ae44",
              # PokeDaisy 1.6.2.1 (mGBA 0.10.5 inside).
              "pokedaisy": "717f4f49979f4aa5c4c8f4cd64638a0fa935d844",
          }
          for name, revision in home.items():
              with zipfile.ZipFile(sys.argv[1]) as archive:
                  built = json.loads(archive.read(f"assets/core-build-{name}.json"))
              assert built["revision"] == revision, name
          with zipfile.ZipFile(sys.argv[1]) as archive:
              gpgx = json.loads(archive.read("assets/core-build-genesis_plus_gx.json"))
          assert "0001-sms-gg-state-load-tile-cache.patch" in gpgx["patches"]
          with zipfile.ZipFile(sys.argv[1]) as archive:
              fbneo = json.loads(archive.read("assets/core-build-fbneo.json"))
          assert "neogeo-subset.patch" in fbneo["patches"]
          assert {"flash-bank-survives-mask.patch",
                  "gb-dmg-palette-follows-option.patch",
                  "543a19758-mbc2-sram-bank.patch"} <= set(mgba["patches"])
          assert "patch-mgba-active-sram.py" in mgba["patches"]
          assert "patch-mgba-sun.py" in mgba["patches"]
          assert "patch-mgba-twb64.py" in mgba["patches"]
          assert "patch-mgba-link-peer-bios.py" in mgba["patches"]
          assert "patch-mgba-gb-direct-cable.py" in mgba["patches"]
          assert "aw-session-reset.patch" in gpsp["patches"]
          assert "patch-gpsp-backend-diagnostic.py" in gpsp["patches"]
          assert gpsp["native_aw_harness"] == "asan-passed"
          print("Verified shipping native-core provenance and critical patch list")
          PY
          # The signed KONKR APK must not contain AVD keyboard detection or
          # isolated Multiplayer Lab storage behavior from src/debug.
          unzip -Z -1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings -a |
                grep -E 'sdk_gphone|ranchu|goldfish|fyi[.]slot[.]konkr[.]lab|Multiplayer Lab:'; then
              echo "::error::Found AVD / Multiplayer Lab test code in release DEX"
              exit 1
            fi
          done < <(unzip -Z -1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          sha256sum "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: slot-for-android-arm64-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  # The tests run beside the APK (3.0.1-beta13): a beta's APK no longer
  # waits for them; a release still does (publish needs both).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"; then break; fi
            if [ "$attempt" -eq 4 ]; then echo "::error::Android SDK download failed"; exit 1; fi
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Test capture tools
        run: python3 -m unittest discover -s tools/emulation-lab -p 'test_*.py' -v
      - name: Test RetroAchievements
        run: cargo test -p slot-achievements -p slot-retro
      - name: Test KONKR 3:2 scaling
        run: cargo test -p slot-gfx --no-default-features --test konkr
      - name: Test interface graphics
        run: |
          cargo test -p slot-ui --lib onboarding_tests
          cargo test -p slot-ui --test cart_material --test new_cart_material --test upstream_v17_assets --test native_resolution --test insert_neighbour_motion --test mixed_shelf_parity --test chrome_crt_parity --test native_density --test link_hardware
      - name: Test Android library
        run: cargo test -p slot-android --lib
      - name: Test every menu row shows its value (runtime menus)
        run: |
          set -euo pipefail
          bash .github/scripts/apt-install.sh libegl-dev
          cargo test -p slot-android --features runtime-tests --lib runtime:: 2>&1 | tee "$RUNNER_TEMP/menu-tests.log"
          grep -F 'test runtime::settings_value_tests::every_settings_row_shows_its_value ... ok' "$RUNNER_TEMP/menu-tests.log"
      - name: Test Android debug and release policies on JVM
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:testReleaseUnitTest

  publish:
    # Only the explicit release merge into main publishes a stable release:
    # its commit title must be "release: slot. for Android vX.Y.Z" (or the
    # old "release: slot. for KONKR Pocket Advance vX.Y.Z") with X.Y.Z =
    # versionName. No beta, branch CI, manual run or tag push
    # can publish.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'release: slot. for Android v') ||
       startsWith(github.event.head_commit.message, 'release: slot. for KONKR Pocket Advance v'))
    needs: [arm64-apk, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: slot-for-android-arm64-signed
          path: release-assets

      - name: Validate, create GitHub-verified release commit, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' android/app/build.gradle.kts)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::versionName $version is not a release version"; exit 1;
          }
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)"
          [[ "$title" == "release: slot. for Android v$version"* ||
             "$title" == "release: slot. for KONKR Pocket Advance v$version"* ]] || {
            echo "::error::Release title does not match versionName $version"; exit 1;
          }
          # Until the repository is renamed to slot-for-android, releases keep
          # the old tag and APK names that installed 1.3.4 updaters look for.
          if [[ "$GITHUB_REPOSITORY" == */slot-for-kpa ]]; then
            tag="konkr-v$version"
            file="slot-for-konkr-$version-arm64.apk"
          else
            tag="v$version"
            file="slot-for-android-$version-arm64.apk"
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s release-assets/app-release.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite"
            exit 1
          fi
          mv release-assets/app-release.apk "release-assets/$file"
          (cd release-assets && sha256sum "$file" > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

          # As in v1.1.0: create a no-source-change GitHub-signed commit,
          # then verify GitHub's signature BEFORE tagging or publishing.
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || {
            echo "::error::main moved during release; abort"; exit 1;
          }
          tree="$(git rev-parse 'HEAD^{tree}')"
          jq -nc --arg tree "$tree" --arg parent "$GITHUB_SHA" \
            --arg message "chore: signed v$version release reference" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - \
            > "$RUNNER_TEMP/signed-commit.json"
          verified="$(jq -r '.verification.verified' "$RUNNER_TEMP/signed-commit.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/signed-commit.json")"
          test "$verified" = true || {
            echo "::error::GitHub did not verify release commit; release not published"
            exit 1
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.verification.verified')" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f sha="$sha" -F force=false >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$sha"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$sha"

          gh release create "$tag" "release-assets/$file" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "slot. for Android v$version" \
            --notes-file RELEASE-NOTES.md

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json name,isDraft,isPrerelease,tagName,assets,url \
            | tee "$RUNNER_TEMP/release-result.json"
          jq -e --arg tag "$tag" --arg apk "$file" \
            '.tagName == $tag and (.isDraft == false) and (.isPrerelease == false) and
             ([.assets[].name] | index($apk) != null and index("SHA256SUMS.txt") != null)' \
            "$RUNNER_TEMP/release-result.json"
          mkdir -p "$RUNNER_TEMP/check-published-assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/check-published-assets"
          (cd "$RUNNER_TEMP/check-published-assets" && sha256sum -c SHA256SUMS.txt)
          echo "Published stable verified v$version tag at $sha"
