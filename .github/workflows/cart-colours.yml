name: cart-colours

on:
  push:
    branches: [tools/cart-colours]
    paths: [tools/cart-colours/**, .github/workflows/cart-colours.yml]

concurrency:
  group: cart-colours
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SS_DEVID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SS_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      SS_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
      SS_USER: ${{ secrets.SCREENSCRAPER_SSID }}
      SS_PASSWORD: ${{ secrets.SCREENSCRAPER_SSPASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cart-colours/check.py

  scrape:
    needs: check
    # Two jobs = the two ScreenScraper threads the account allows; never run this while
    # the weekly Cart art harvest is running.
    strategy:
      fail-fast: false
      matrix:
        group: [NES-MD, SNES]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SS_DEVID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SS_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      SS_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
      SS_USER: ${{ secrets.SCREENSCRAPER_SSID }}
      SS_PASSWORD: ${{ secrets.SCREENSCRAPER_SSPASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow scipy
      # ScreenScraper's images stay in the workflow cache, which only this repository's
      # workflows can read; they are never uploaded as artifacts.
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: cart-colours-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            cart-colours-${{ matrix.group }}-
            cart-colours-
      - if: hashFiles('tools/cart-colours/probe.json') != ''
        run: cd tools/cart-colours && python3 -u probe.py probe.json
      - if: hashFiles('tools/cart-colours/probe.json') == ''
        run: python3 -u tools/cart-colours/scrape.py --limit "$(cat tools/cart-colours/limit.txt)" --only "$(cat tools/cart-colours/only.txt 2>/dev/null)" --systems "${{ matrix.group == 'SNES' && 'SNES' || 'NES,MD' }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: cart-colours-${{ matrix.group }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cart-colours-measures-${{ matrix.group }}
          path: out/
          retention-days: 30
